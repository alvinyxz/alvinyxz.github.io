title: alvinyxz
# No theme — using a custom _layouts/default.html.
theme: null

# Default layout: any page without explicit front matter still uses this.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# README.md is the homepage source — keep it in the published site.
# Excludes below are publish-side tooling that doesn't belong on the site.
exclude:
  - build.py
  - publish.sh
  - cards.md
  - cards.html
  - node_modules
  - package-lock.json
  - .gitignore
  - .DS_Store

# Without this, Jekyll wouldn't expose README.md as a page.
include:
  - README.md
