<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title | default: "alvinyxz" }}</title>
<style>
  :root {
    --bg: #fafafa;
    --fg: #1a1a1a;
    --muted: #666;
    --accent: #2a5db0;
    --accent-hover: #1e4a8f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column;
    line-height: 1.55;
  }
  .topbar {
    display: flex; justify-content: flex-end; align-items: center;
    padding: 14px 24px;
    background: #fff;
    border-bottom: 1px solid #eee;
  }
  .topbar .churning-link {
    padding: 8px 16px;
    background: var(--accent); color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px; font-weight: 500;
  }
  .topbar .churning-link:hover { background: var(--accent-hover); }

  main {
    flex: 1;
    max-width: 760px;
    margin: 48px auto;
    padding: 0 24px 80px;
  }
  main h1 { font-size: 32px; margin: 0 0 16px; }
  main h2 { font-size: 22px; margin: 32px 0 12px; }
  main p { color: #333; }
  main a { color: var(--accent); }
  main code {
    background: #f0f0f0; padding: 2px 6px; border-radius: 4px;
    font-size: 0.92em;
  }
  main pre {
    background: #f5f5f5; padding: 12px 16px; border-radius: 6px;
    overflow-x: auto;
  }
  main pre code { background: transparent; padding: 0; }
  main blockquote {
    border-left: 3px solid #ddd; margin: 0; padding: 4px 16px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="churning-link" href="{{ '/churning.html' | relative_url }}">Churning</a>
  </div>

  <main>
    {{ content }}
  </main>
</body>
</html>
